# Sign and Heaviside gate at 0 steps on every 16-bit input below (1 on the strided
# Float32 input, where a finite sample cannot assert exactness). The in-tree WH kernels
# branch on `abs(v) == 0`, so -0.0 is answered as zero (fixed in #55306), and a
# recurrence is a regression, not specified behaviour. Their block-float inputs read one
